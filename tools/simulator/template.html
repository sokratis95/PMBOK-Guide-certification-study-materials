<title>PMP Exam Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Ten full-length PMP practice exams for the PMBOK Guide Eighth Edition, with a timed exam mode, practice mode, quick quizzes and scoring by domain and task.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap">
<style>
:root{
  --bg:#f2f4f7;--surface:#ffffff;--surface-2:#f7f9fb;--sunken:#e8edf3;
  --ink:#132033;--ink-2:#435369;--ink-3:#5f6f85;
  --line:#d7dee7;--line-2:#bcc7d4;
  --brand:#173f6b;--brand-hover:#0f3157;--brand-ink:#ffffff;--brand-soft:#e2eaf4;
  --sel:#1d5aa6;--sel-ink:#ffffff;--sel-soft:#e9f0fa;--focus:#2563b8;
  --flag:#9c4f00;--flag-mark:#e08a1e;--flag-soft:#fcefdc;
  --ok:#146b45;--ok-mark:#1f9a5f;--ok-soft:#e2f2e9;
  --warn:#835500;--warn-mark:#e3a21a;--warn-soft:#fcf1d6;
  --bad:#ab261d;--bad-mark:#d23f35;--bad-soft:#fae7e5;
  --track:#dde4ee;
  --shadow-1:0 1px 2px rgba(15,30,55,.06),0 2px 8px rgba(15,30,55,.05);
  --shadow-2:0 12px 40px rgba(15,30,55,.2);
  --r:10px;--r-sm:7px;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-read:"IBM Plex Serif",Georgia,Cambria,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1117;--surface:#131a23;--surface-2:#17202b;--sunken:#1c2632;
    --ink:#e3e9f0;--ink-2:#a9b5c4;--ink-3:#8b98aa;
    --line:#253140;--line-2:#3a4859;
    --brand:#3a6da8;--brand-hover:#4a7db7;--brand-ink:#ffffff;--brand-soft:#1a2a3d;
    --sel:#80b1ef;--sel-ink:#0c1117;--sel-soft:#16273b;--focus:#8ab8f5;
    --flag:#f0a64c;--flag-mark:#f0a64c;--flag-soft:#33240f;
    --ok:#62cf98;--ok-mark:#3fb37a;--ok-soft:#10291c;
    --warn:#f0c04f;--warn-mark:#e3a21a;--warn-soft:#30260c;
    --bad:#f4918a;--bad-mark:#e0554b;--bad-soft:#361614;
    --track:#243142;
    --shadow-1:0 1px 2px rgba(0,0,0,.35),0 2px 10px rgba(0,0,0,.25);
    --shadow-2:0 12px 48px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1117;--surface:#131a23;--surface-2:#17202b;--sunken:#1c2632;
  --ink:#e3e9f0;--ink-2:#a9b5c4;--ink-3:#8b98aa;
  --line:#253140;--line-2:#3a4859;
  --brand:#3a6da8;--brand-hover:#4a7db7;--brand-ink:#ffffff;--brand-soft:#1a2a3d;
  --sel:#80b1ef;--sel-ink:#0c1117;--sel-soft:#16273b;--focus:#8ab8f5;
  --flag:#f0a64c;--flag-mark:#f0a64c;--flag-soft:#33240f;
  --ok:#62cf98;--ok-mark:#3fb37a;--ok-soft:#10291c;
  --warn:#f0c04f;--warn-mark:#e3a21a;--warn-soft:#30260c;
  --bad:#f4918a;--bad-mark:#e0554b;--bad-soft:#361614;
  --track:#243142;
  --shadow-1:0 1px 2px rgba(0,0,0,.35),0 2px 10px rgba(0,0,0,.25);
  --shadow-2:0 12px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{line-height:1.2;margin:0;font-weight:600;letter-spacing:-.005em}
p{margin:0}
b,strong{font-weight:600}
.ico{width:18px;height:18px;flex:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.muted{color:var(--ink-3)}
.small{font-size:13.5px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.grow{flex:1}
.center{text-align:center;margin-top:12px}
.wrap{max-width:1120px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap.narrow{max-width:760px}
.eyebrow{font-size:12.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:500;font-size:15px;line-height:1.2;white-space:nowrap;transition:background-color .12s,border-color .12s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn.danger{background:var(--bad-mark);border-color:var(--bad-mark);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunken);color:var(--ink)}
.btn.small{min-height:32px;padding:5px 12px;font-size:14px}
.btn.big{min-height:48px;padding:10px 22px;font-size:16px}
.btn:disabled,.btn:disabled:hover{opacity:.45;cursor:not-allowed;border-color:var(--line-2)}
.btn.primary:disabled{border-color:var(--brand);background:var(--brand)}
.back{margin:0 0 12px -12px}
.ibtn{display:inline-grid;place-items:center;width:40px;height:40px;flex:none;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;color:var(--ink-2)}
.ibtn:hover{background:var(--sunken);color:var(--ink)}
.linkbtn{border:0;background:none;padding:0;color:var(--sel);text-decoration:underline;text-underline-offset:2px;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.chip.sel{background:var(--sel-soft);color:var(--sel)}
.chip .ico{width:14px;height:14px}

/* home */
.mast{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:28px}
.mast h1{font-size:clamp(30px,4.4vw,42px);letter-spacing:-.02em;margin:8px 0 12px}
.lede{color:var(--ink-2);max-width:64ch;font-size:16.5px}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:16px;color:var(--ink-2);font-size:14.5px}
.facts b{color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1)}
.pad{padding:18px}
.resume{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;padding:16px 18px;margin-bottom:8px;border-left:4px solid var(--sel)}
.resume h2{font-size:19px;margin:4px 0}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin:36px 0 14px}
.sec-h h2{font-size:20px}
.sec-h p{color:var(--ink-3);font-size:14px}
.grid-exams{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.ecard{padding:16px;display:flex;flex-direction:column;gap:10px}
.ecard-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ecard h3{font-size:17.5px}
.ecard .meta{font-size:13.5px;color:var(--ink-3)}
.ecard .stat{font-size:14px;color:var(--ink-2);min-height:21px}
.ecard .acts{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.ecard .acts .btn{flex:1;min-height:38px;padding:7px 10px;font-size:14.5px}
.quiz{padding:18px;display:grid;gap:16px}
.quiz-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.field label{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.field select{width:100%;min-height:40px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:6px 10px}
.quiz-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.quiz-foot p{color:var(--ink-3);font-size:14px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th{font-weight:500;color:var(--ink-3);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
table.data td{padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data .num{text-align:right;font-variant-numeric:tabular-nums}
table.data tbody tr:last-child td{border-bottom:0}
table.data tbody tr:hover{background:var(--surface-2)}
.foot{margin-top:52px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3);display:grid;gap:8px}
kbd{font-family:var(--f-mono);font-size:11.5px;padding:1px 6px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;background:var(--surface);color:var(--ink-2)}

/* performance rows, meters, ratings */
.perf{padding:4px 18px}
.perf-cap{padding:14px 0 6px;font-size:14px;color:var(--ink-2)}
.prow{display:grid;grid-template-columns:minmax(0,1.7fr) 110px minmax(80px,2fr) 170px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .lbl{font-weight:500;min-width:0}
.prow .lbl small{display:block;color:var(--ink-3);font-weight:400;font-size:13px}
.prow .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:14px;white-space:nowrap}
.prow .val b{color:var(--ink)}
.meter{position:relative;height:8px;border-radius:3px;background:var(--track)}
.meter>span{position:absolute;left:0;top:0;bottom:0;border-radius:3px 4px 4px 3px;background:var(--sel);max-width:100%}
.meter>span.r4{background:var(--ok-mark)}.meter>span.r3{background:var(--sel)}.meter>span.r2{background:var(--warn-mark)}.meter>span.r1{background:var(--bad-mark)}
.meter.big{height:12px;margin-top:16px}
.meter .mark{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--ink-2);border-radius:1px}
.meter-scale{position:relative;height:18px;margin-top:6px;font-size:12px;color:var(--ink-3)}
.meter-scale span{position:absolute;top:0;white-space:nowrap}
.rating{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px 3px 8px;border-radius:999px;white-space:nowrap}
.rating .ico{width:15px;height:15px}
.rating.r4{background:var(--ok-soft);color:var(--ok)}.rating.r3{background:var(--sel-soft);color:var(--sel)}.rating.r2{background:var(--warn-soft);color:var(--warn)}.rating.r1{background:var(--bad-soft);color:var(--bad)}
@media (max-width:700px){.prow{grid-template-columns:minmax(0,1fr) auto;gap:8px 12px}.prow .meter{grid-column:1/-1;order:3}.prow .rt{grid-column:1/-1;order:4}}

/* exam chrome */
.xbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.xbar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:8px}
.xtitle{min-width:0;flex:1;padding-left:2px}
.xtitle strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xtitle span{display:block;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:5px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface-2);font-family:var(--f-mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer .ico{width:16px;height:16px;color:var(--ink-3)}
.timer.warn{border-color:var(--warn-mark);background:var(--warn-soft);color:var(--warn)}
.timer.crit{border-color:var(--bad-mark);background:var(--bad-soft);color:var(--bad)}
.timer.warn .ico,.timer.crit .ico{color:inherit}
.tool{padding:8px 10px}
.tool[aria-pressed="true"]{background:var(--sel-soft);color:var(--sel)}
@media (max-width:720px){.tool .lbl{display:none}.tool{padding:8px;min-width:40px}}
@media (max-width:520px){.xbar-in{gap:2px}.xbar .ibtn{width:36px}.timer{padding:5px 10px;font-size:14px}.timer .ico{display:none}.tool{min-width:36px;padding:6px}}
.pbar{height:3px;background:var(--track)}
.pbar span{display:block;height:100%;background:var(--sel);transition:width .25s}
.xmain{padding:26px max(16px,env(safe-area-inset-right,0px)) 132px max(16px,env(safe-area-inset-left,0px));outline:none}
.qlayout{max-width:780px;margin:0 auto}
.qlayout.with-case{max-width:1240px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:30px;align-items:start}
.case{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:22px}
.case-h{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:32px}
.case h3{font-size:16.5px;margin:2px 0 10px}
.case.collapsed .md{display:none}
.case.collapsed h3{margin-bottom:0}
@media (min-width:1000px){
  .qlayout.with-case .case{position:sticky;top:84px;max-height:calc(100vh - 180px);overflow:auto;margin:0}
  .case-tog{display:none}
  .case.collapsed .md{display:block}
  .case.collapsed h3{margin-bottom:10px}
}
@media (max-width:999px){.qlayout.with-case{display:block;max-width:780px}}
.md{font-family:var(--f-read);font-size:15.5px;line-height:1.62}
.md p{margin:0 0 10px}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md li{margin:4px 0}
.md .tblx{overflow-x:auto;margin:4px 0 12px}
.md table{border-collapse:collapse;font-family:var(--f-ui);font-size:14px;width:100%}
.md th,.md td{border-bottom:1px solid var(--line);padding:6px 10px 6px 0;text-align:left;vertical-align:top;font-variant-numeric:tabular-nums}
.md th{color:var(--ink-3);font-weight:500;font-size:13px}
.qmeta{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin-bottom:14px;min-height:40px}
.qnum{font-family:var(--f-mono);font-size:13px;color:var(--ink-3);letter-spacing:.02em}
.flagbtn{margin-left:auto;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);min-height:36px;padding:6px 12px;font-size:14px}
.flagbtn[aria-pressed="true"]{color:var(--flag);border-color:var(--flag-mark);background:var(--flag-soft)}
.flagbtn[aria-pressed="true"] .ico{fill:currentColor}
.stem{font-family:var(--f-read);font-size:19px;line-height:1.62;margin:0 0 22px;color:var(--ink)}
.opts{display:grid;gap:10px}
.opt{position:relative;display:flex;align-items:stretch;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);transition:border-color .12s,background-color .12s,box-shadow .12s}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.opt label{flex:1;display:flex;gap:12px;align-items:flex-start;padding:12px 6px 12px 14px;cursor:pointer;min-height:54px;border-radius:var(--r)}
.opt .ltr,.mkey .ltr{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line-2);font-weight:600;font-size:13.5px;color:var(--ink-2);background:var(--surface)}
.opt.multi .ltr{border-radius:7px}
.otext{padding-top:2px;font-size:16px;line-height:1.5;min-width:0}
.opt:hover{border-color:var(--ink-3)}
.opt.sel{border-color:var(--sel);background:var(--sel-soft);box-shadow:inset 0 0 0 1px var(--sel)}
.opt.sel .ltr{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.opt input:focus-visible+label{outline:2px solid var(--focus);outline-offset:2px}
.opt.struck .otext{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--ink-3)}
.opt.struck .ltr{opacity:.5}
.strike{flex:none;align-self:center;margin-right:6px;width:38px;height:38px;border-radius:var(--r-sm);border:0;background:transparent;color:var(--ink-3);display:grid;place-items:center}
.strike:hover{background:var(--sunken);color:var(--ink)}
.strike[aria-pressed="true"]{color:var(--bad)}
.opt.locked label{cursor:default}
.opt.locked:hover{border-color:var(--line-2)}
.opt.right,.opt.right:hover{border-color:var(--ok-mark);background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--ok-mark)}
.opt.right .ltr{background:var(--ok-mark);border-color:var(--ok-mark);color:#fff}
.opt.wrong,.opt.wrong:hover{border-color:var(--bad-mark);background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad-mark)}
.opt.wrong .ltr{background:var(--bad-mark);border-color:var(--bad-mark);color:#fff}
.otag{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:13px;font-weight:600}
.otag .ico{width:15px;height:15px}
.otag.ok{color:var(--ok)}.otag.bad{color:var(--bad)}
.hint{font-size:13.5px;color:var(--ink-3);margin-top:10px}
.mkey{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px}
.mkey li{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);font-size:15.5px}
.mkey li span:last-child{padding-top:3px}
.mrows{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding:12px 14px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface)}
.mrow.right{border-color:var(--ok-mark);box-shadow:inset 0 0 0 1px var(--ok-mark)}
.mrow.wrong{border-color:var(--bad-mark);box-shadow:inset 0 0 0 1px var(--bad-mark)}
.mitem{font-weight:500;display:flex;gap:10px;align-items:baseline}
.mn{font-family:var(--f-mono);font-size:13px;color:var(--ink-3)}
.mpick{display:flex;gap:6px}
.mpick input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.mpick label{display:grid;place-items:center;width:42px;height:40px;border-radius:var(--r-sm);border:1px solid var(--line-2);font-weight:600;cursor:pointer;background:var(--surface);color:var(--ink-2)}
.mpick label:hover{border-color:var(--ink-3)}
.mpick input:checked+label{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.mpick input:focus-visible+label{outline:2px solid var(--focus);outline-offset:2px}
.mpick input:disabled+label{cursor:default}
.mpick label.right,.mpick input:checked+label.right{background:var(--ok-mark);border-color:var(--ok-mark);color:#fff}
.mpick input:checked+label.wrong{background:var(--bad-mark);border-color:var(--bad-mark);color:#fff}
.mfix{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;color:var(--ok)}
.mfix .ico{width:15px;height:15px}
@media (max-width:560px){.mrow{grid-template-columns:1fr}}
.fill{display:grid;gap:8px;max-width:380px}
.fill label{font-weight:500;font-size:14px;color:var(--ink-2)}
.fill input{min-height:50px;padding:10px 14px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);font-family:var(--f-mono);font-size:18px;width:100%}
.fill input:focus{border-color:var(--sel);outline:none;box-shadow:0 0 0 3px var(--sel-soft)}
.fill.right input{border-color:var(--ok-mark);box-shadow:inset 0 0 0 1px var(--ok-mark)}
.fill.wrong input{border-color:var(--bad-mark);box-shadow:inset 0 0 0 1px var(--bad-mark)}
.fill .hint{margin-top:0}
.fb{margin-top:22px;border-radius:var(--r);padding:16px 18px;border:1px solid var(--line);background:var(--surface);outline:none}
.fb.ok{border-left:4px solid var(--ok-mark)}.fb.bad{border-left:4px solid var(--bad-mark)}

const icon = n => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[n]}</svg>`;

/* ---------- helpers ---------- */
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC[c]);
const pad = n => String(n).padStart(2, '0');
const pct = (c, t) => t ? Math.round(100 * c / t) : 0;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  const lines = String(text).split('\n'); let out = '', i = 0;

  while (i < lines.length) {

    if (/^\s*\|/.test(ln)) {
      const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);

        body.map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
    } else if (/^\s*[-*] /.test(ln)) {
      const items = []; while (i < lines.length && /^\s*[-*] /.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*] /, ''));
      out += '<ul>' + items.map(t => '<li>' + inline(t) + '</li>').join('') + '</ul>';
    } else if (/^\s*\d+\. /.test(ln)) {

/* ---------- scoring ---------- */
function isAnswered(Q, a) {
  if (a == null) return false;

function parseNum(s) {

async function initCloud() {

  try {
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const col = db.doc('data/users/' + id + '/sim').collection('attempts');
    const snap = await retryOnce(() => col.get());
    const have = new Set(S.history.map(h => h.id));
    let added = 0;
    snap.docs.forEach(d => {
      const body = d.data();
      if (!body || typeof body.json !== 'string') return;
      let h; try { h = JSON.parse(body.json); } catch (e) { return; }
      if (!validAttempt(h) || have.has(h.id)) return;
      S.history.push(h); have.add(h.id); added++;

    cloud = { col };
    if (added) {
      S.history.sort((x, y) => String(y.finishedAt).localeCompare(String(x.finishedAt)));

    pos: 0, section: 0, phase: kind === 'exam' ? 'intro' : 'question', subset: null,

}
let clock = null;
function account() {
  const a = S.current;

  if (a.phase === 'break') { a.breakMs = Math.max(0, a.breakMs - dt); return a.breakMs <= 0 ? 'break-over' : null; }
  if (a.phase === 'question' || a.phase === 'review') {

}

}

const CALC_KEYS = ['7', '8', '9', '÷', '4', '5', '6', '×', '1', '2', '3', '−', '0', '.', '%', '+', '(', ')', '⌫', 'C', '='];

function mixedExam() {
  const outc = outcomes();
  const rank = ref => { const o = outc.get(ref[0] + ':' + ref[1]); return (o === undefined ? 0 : o === false ? 1 : 2) + Math.random(); };
  const quota = { People: 59, Process: 74, 'Business Environment': 47 };
  const sets = {}, singles = { People: [], Process: [], 'Business Environment': [] };
  EXAMS.forEach(e => e.questions.forEach((q, i) => { const ref = [e.id, i]; if (q.case) (sets[q.case] = sets[q.case] || []).push(ref); else singles[q.domain].push(ref); }));
  const cand = Object.keys(sets).map(k => ({ refs: sets[k], dom: getQ(sets[k][0]).domain, r: sets[k].reduce((t, x) => t + rank(x), 0) / sets[k].length })).sort((a, b) => a.r - b.r);
  const chosen = [];
  cand.forEach(c => { if (chosen.length < 2 && !chosen.some(x => x.dom === c.dom)) chosen.push(c); });
  cand.forEach(c => { if (chosen.length < 2 && chosen.indexOf(c) < 0) chosen.push(c); });
  chosen.forEach(c => c.refs.forEach(ref => { quota[getQ(ref).domain]--; }));
  const full = { People: 59, Process: 74, 'Business Environment': 47 };
  let pool = [];
  DOMAINS.forEach(d => {
    const need = Math.max(0, quota[d]);
    const casePred = chosen.reduce((t, c) => t + c.refs.filter(ref => getQ(ref).domain === d && getQ(ref).approach === 'Predictive').length, 0);
    const predWant = Math.min(need, Math.max(0, Math.round(full[d] * 0.4) - casePred));
    const ranked = singles[d].map(ref => ({ ref, r: rank(ref), pred: getQ(ref).approach === 'Predictive' })).sort((a, b) => a.r - b.r);
    let pick = ranked.filter(x => x.pred).slice(0, predWant);
    pick = pick.concat(ranked.filter(x => !x.pred).slice(0, need - pick.length));
    if (pick.length < need) pick = pick.concat(ranked.filter(x => pick.indexOf(x) < 0).slice(0, need - pick.length));
    pool = pool.concat(pick.map(x => x.ref));
  });
  shuffle(pool);
  const secs = shuffle([0, 1, 2]), out = [];
  for (let s = 0; s < NSEC; s++) {
    const block = chosen[secs.indexOf(s)];
    const part = pool.splice(0, SEC - (block ? block.refs.length : 0));
    if (block) part.splice(Math.floor(Math.random() * (part.length + 1)), 0, ...block.refs);
    out.push(...part);
  }
  return out;
}
function quizPanel() {

    mdBlocks(c.text).forEach(b => {
      if (b.type === 'p') para(b.text, Object.assign({ sz: 9.3, col: C.ink2, after: 1.8 }, o));
      else if (b.type === 'ul') { b.items.forEach(t => bullet(t, 9.3, C.ink2, L + 4.5, CW - 4.5, C.brand)); gap(1.8, C.brand); }
      else caseTable(b);
    });
    y += 5;
  }
  function question(x, k, seen) {
    const Q = x.Q, newCase = !!(Q.case && CASES[Q.case] && !seen[Q.case]);
    const moved = room(newCase ? Math.min(caseHeight(CASES[Q.case]) + 36, PH - B - T - 6) : 36);
    if (k > 0 && !moved) { stroke(C.line, 0.3); doc.line(L, y, L + CW, y); y += 5.5; }
    if (newCase) { caseBlock(Q.case, seen); room(34); }
    const top = y, label = 'Question ' + (x.i + 1);
    font('bold', 11.5, C.brand); doc.text(label, L, top + 4.3);
    let px = L + doc.getTextWidth(label) + 3;
    px += pill(x.ans ? 'INCORRECT' : 'NOT ANSWERED', px, top + 0.4, x.ans ? C.bad : C.ink2, x.ans ? C.badSoft : C.sunken) + 2;
    if (x.f) pill('FLAGGED', px, top + 0.4, C.flag, C.flagSoft);
    y = top + 7.4;
    para(`${Q.domain} · ${Q.task} ${TASKS[Q.task] || ''} · ${Q.approach}` + (TASK_CH[Q.task] ? ` · revise ${chapterRef(Q.task)}` : ''), { sz: 8, col: C.muted, after: 2.6 });
    if (Q.case && CASES[Q.case] && !newCase) caseBlock(Q.case, seen);
    para(Q.stem, { sz: 10.4, col: C.ink, after: 3 });
    if (Q.type === 'single' || Q.type === 'multi') {
      Q.options.forEach((o, j) => {
        const right = Q.answer.indexOf(j) >= 0, mine = Array.isArray(x.a) && x.a.indexOf(j) >= 0;
        optBox(LET[j], o, right ? 'right' : mine ? 'wrong' : '', right && mine ? '✓ Your answer · correct' : right ? '✓ Correct answer' : mine ? '✗ Your answer' : '');
      });
    } else if (Q.type === 'match') matchTable(Q, x.a);
    else fillAns(Q, x);
    y += 1.2;
    room(14);
    font('bold', 7, C.brand); doc.text('EXPLANATION', L, y + 3, { charSpace: 0.3 }); y += 4.8;
    para(Q.expl, { sz: 9.8, col: C.ink2, after: 5 });
  }

  /* summary */
  const list = corrections(h), p = h.scored ? h.correct / h.scored : 0, r = rating(p);
  font('bold', 7, C.muted); doc.text('PMP EXAM SIMULATOR · CORRECTIONS REPORT', L, y + 3, { charSpace: 0.35 }); y += 7;
  para(h.title, { st: 'bold', sz: 21, col: C.brand, f: 1.2, after: 1.2 });
  para(`${KIND[h.kind]} · finished ${fmtDate(h.finishedAt)} · time used ${fmtDur(h.elapsedMs)}${h.reason === 'time' ? ' · time expired' : ''}`, { sz: 9, col: C.muted, after: 6 });
  const top = y, big = pct(h.correct, h.scored) + '%';
  font('bold', 30, C.ink); doc.text(big, L, top + 11);
  const bx = L + doc.getTextWidth(big) + 7;
  font('normal', 10.5, C.ink); doc.text(pdfSafe(h.kind === 'exam' ? `${h.correct} of ${h.total} questions correct` : `${h.correct} of ${h.scored} answered questions correct`), bx, top + 5.4);
  font('bold', 9.4, RC[r.k][0]); doc.text(pdfSafe(`Indicative rating: ${r.t}`), bx, top + 10.8);
  y = top + 16;
  meter(L, y, CW, p, RC[r.k][1], 2.6);
  fill(C.ink2); doc.rect(L + CW * 0.75 - 0.3, y - 1.3, 0.6, 5.2, 'F');
  font('normal', 7, C.muted); doc.text('75% readiness guide', L + CW * 0.75, y + 7.6, { align: 'center' });
  y += 13;
  const nWrong = list.filter(x => x.ans).length, nSkip = list.length - nWrong;
  const what = h.kind === 'exam' ? 'missed' : 'got wrong';
  para(list.length > 1
    ? `This report lists the ${list.length} questions you ${what}` + (nSkip ? ` (${nWrong} answered incorrectly, ${nSkip} not answered)` : '') + '. Each one shows the correct answer, the answer you gave, the explanation and the Study Guide chapter to revise.'
    : list.length ? `This report lists the one question you ${what}, with the correct answer, the answer you gave, the explanation and the Study Guide chapter to revise.`
    : 'There is nothing to correct: every question you answered is right.', { sz: 10, col: C.ink2, after: 7 });
  heading('Score by domain');
  perfTable(DOMAINS.map(d => [d, h.dom[d]]));
  heading('Score by delivery approach');
  perfTable(APPROACHES.map(a => [a, h.appr[a]]));
  const weak = Object.keys(h.task).filter(t => h.task[t][1] >= 2 && h.task[t][0] / h.task[t][1] < 0.8)
    .sort((a, b) => h.task[a][0] / h.task[a][1] - h.task[b][0] / h.task[b][1] || a.localeCompare(b, 'en', { numeric: true })).slice(0, 6);
  if (weak.length) {
    heading('Where to focus');
    weak.forEach(t => { const [c, n] = h.task[t]; bullet(`${t} ${TASKS[t]}: ${c} of ${n} correct (${pct(c, n)}%). Revise ${chapterRef(t)}.`, 9.6, C.ink, L, CW, null); y += 0.8; });
    y += 5;
  }
  if (list.length) {
    if (y > PH - B - 70) newPage(); else y += 2;
    heading(`Corrections (${list.length})`);
    const seen = {};
    list.forEach((x, k) => question(x, k, seen));
  }
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i);
    stroke(C.line, 0.2); doc.line(L, PH - 13, L + CW, PH - 13);
    font('normal', 7.4, C.muted);
    doc.text(pdfSafe(`PMP Exam Simulator · ${h.title} · corrections`), L, PH - 8.5);
    doc.text(`Page ${i} of ${n}`, L + CW, PH - 8.5, { align: 'right' });
  }
  const bytes = new Uint8Array(doc.output('arraybuffer'));
  const from = Array.from('/Ordering (Identity-H)', ch => ch.charCodeAt(0)), to = Array.from('/Ordering (Identity)  ', ch => ch.charCodeAt(0));
  for (let i = 0; i <= bytes.length - from.length; i++) {
    let j = 0;
    while (j < from.length && bytes[i + j] === from[j]) j++;
    if (j === from.length) { bytes.set(to, i); i += from.length - 1; }
  }
  return { blob: new Blob([bytes], { type: 'application/pdf' }), pages: n };
}

/* ---------- actions ---------- */
const ACT = {
  theme() { prefs.theme = { auto: 'light', light: 'dark', dark: 'auto' }[prefs.theme] || 'auto'; applyTheme(); savePrefs(); rerender(); },
  start(b) { const ex = +b.dataset.exam; startAttempt(b.dataset.kind, ex, null, EXAMS[ex - 1].title, null); },
  quiz() {
    const f = readQuiz(); prefs.quiz = f; savePrefs();
    const refs = shuffle(quizPool(f, outcomes())).slice(0, +f.count);
    if (refs.length) startAttempt('quiz', null, refs, `Quick quiz · ${refs.length} questions`, f);
  },
  'quiz-missed'() {
    const f = { domain: 'all', approach: 'all', source: 'missed', count: '20' };
    const refs = shuffle(quizPool(f, outcomes())).slice(0, 20);
    if (refs.length) startAttempt('quiz', null, refs, `Missed questions · ${refs.length}`, f);
  },
  resume() { if (!S.current) return; view = { screen: 'exam' }; render(); toTop(); },
  async discard() {
    if (await ask({ title: 'Discard this attempt?', body: 'The answers in your unfinished attempt will be deleted.', ok: 'Discard', danger: true })) { S.current = null; saveNow(); rerender(); }
  },
  begin() { const a = S.current; a.phase = 'question'; a.pos = 0; saveNow(); render(); toTop(); },
  exit() {
    const a = S.current;
    saveNow(); view = { screen: 'home' }; render(); toTop();
    if (a) toast(a.kind === 'exam' && a.phase !== 'intro' ? 'Saved. The exam timer is paused until you resume.' : 'Saved. You can resume at any time.');
  },
  prev() {
    const a = S.current; if (!a || a.phase !== 'question') return;
    if (a.kind === 'exam') {
      if (a.subset) { const k = a.subset.list.indexOf(a.pos); if (k > 0) go(a.subset.list[k - 1]); return; }
      if (a.pos > secBounds(a)[0]) go(a.pos - 1);
      return;
    }
    if (a.pos > 0) go(a.pos - 1);
  },
  next() {
    const a = S.current; if (!a || a.phase !== 'question') return;
    const n = refsOf(a).length;
    if (a.kind === 'exam') {
      if (a.subset) { const k = a.subset.list.indexOf(a.pos); if (k >= 0 && k < a.subset.list.length - 1) go(a.subset.list[k + 1]); else showSectionReview(); return; }
      if (a.pos >= secBounds(a)[1]) showSectionReview(); else go(a.pos + 1);
      return;
    }
    if (a.pos < n - 1) go(a.pos + 1); else ACT.finish();
  },
  flag() { const a = S.current; if (!a || a.phase !== 'question') return; a.flags[a.pos] = !a.flags[a.pos]; saveSoon(); rerender(); },
  strike(b) {
    const a = S.current, i = a.pos, k = +b.dataset.k;
    a.strikes[i] = (a.strikes[i] || 0) ^ (1 << k);
    if ((a.strikes[i] >> k) & 1 && Array.isArray(a.answers[i]) && a.answers[i].indexOf(k) >= 0) {
      const rest = a.answers[i].filter(x => x !== k); a.answers[i] = rest.length ? rest : null;
    }
    saveSoon(); rerender();
  },
  check() {
    const a = S.current; if (!a || a.kind === 'exam' || a.phase !== 'question') return;
    const i = a.pos, Q = getQ(refsOf(a)[i]);
    if (a.checked[i] || !isAnswered(Q, a.answers[i])) return;
    a.checked[i] = true; saveSoon(); rerender();
    const fb = document.getElementById('fb'); if (fb) { fb.focus({ preventScroll: true }); fb.scrollIntoView({ block: 'nearest' }); }
  },
  nav() { if (S.current) openNav(); },
  'close-sheet'() { sheet.close(); },
  goto(b) { if (sheet.open) sheet.close(); const a = S.current; a.subset = null; go(+b.dataset.i); },
  sreview() { if (sheet.open) sheet.close(); showSectionReview(); },
  subset(b) {
    const a = S.current, kind = b.dataset.sub, [lo, hi] = secBounds(a), refs = refsOf(a);
    const list = range(lo, hi).filter(i => kind === 'all' || (kind === 'flagged' ? a.flags[i] : !isAnswered(getQ(refs[i]), a.answers[i])));
    if (!list.length) return;
    a.subset = { kind, list }; go(list[0]);
  },
  async 'end-section'() {
    const a = S.current, [lo, hi] = secBounds(a), refs = refsOf(a), last = a.section === NSEC - 1;
    const un = range(lo, hi).filter(i => !isAnswered(getQ(refs[i]), a.answers[i])).length;
    const ok = await ask({
      title: last ? 'Submit the exam?' : `End section ${a.section + 1}?`,
      body: (un ? `<strong>${un}</strong> question${un > 1 ? 's are' : ' is'} still unanswered in this section. ` : 'Every question in this section has an answer. ') + (last ? 'Your exam will be scored, and you can then download a PDF of your corrections.' : `You will not be able to return to questions ${lo + 1}–${hi + 1}.`),
      ok: last ? 'Submit exam' : 'End section'
    });
    if (!ok || S.current !== a) return;
    if (last) { finish('submitted'); return; }
    a.phase = 'breakoffer'; a.subset = null; saveNow(); render(); toTop();
  },
  'start-break'() { const a = S.current; a.phase = 'break'; a.breakMs = BREAK_MS; saveNow(); render(); toTop(); },
  'skip-break'() { startSection(S.current.section + 1); },
  'end-break'() { startSection(S.current.section + 1); },
  async finish() {
    if (sheet.open) sheet.close();
    const a = S.current; if (!a) return;
    const n = refsOf(a).length, done = countAnswered(a);
    const ok = await ask({
      title: a.kind === 'exam' ? 'End the exam now?' : 'Finish this session?',
      body: `You have answered ${done} of ${n} questions. ${a.kind === 'exam' ? 'Unanswered questions count as incorrect.' : 'Only the questions you answered are scored.'}`,
      ok: a.kind === 'exam' ? 'End and score' : 'Finish and score'
    });
    if (ok && S.current === a) finish('submitted');
  },
  'toggle-timer'() { prefs.hideTimer = !prefs.hideTimer; savePrefs(); paintClock(); },
  calc() { toggleCalc(); },
  'calc-close'() { toggleCalc(false); },
  'calc-key'(b) {
    const k = b.dataset.k;
    if (k === 'C') calcIn.value = '';
    else if (k === '⌫') calcIn.value = calcIn.value.slice(0, -1);
    else if (k === '=') { calcEquals(); return; }
    else calcIn.value += k;
    calcUpdate();
  },
  'case-toggle'() { ui.caseCollapsed = !ui.caseCollapsed; rerender(); },
  home() { view = { screen: 'home' }; render(); toTop(); },
  results(b) { view = { screen: 'results', id: b.dataset.id }; render(); toTop(); },
  review(b) { view = { screen: 'review', id: b.dataset.id, filter: b.dataset.f || 'all', domain: 'all' }; render(); toTop(); },
  rfilter(b) { view.filter = b.dataset.f; rerender(); },
  retake(b) {
    const h = findH(b.dataset.id); if (!h) return;
    if (h.kind === 'quiz') startAttempt('quiz', null, shuffle(h.refs.slice()), h.title, h.meta);
    else if (h.refs) startAttempt(h.kind, null, h.refs.slice(), h.title, h.meta);
    else startAttempt(h.kind, h.examId, null, h.title, null);
  },
  mixed() {
    const n = S.history.filter(h => h.meta && h.meta.mixed).length + 1;
    startAttempt('exam', null, mixedExam(), `Mixed exam ${n}`, { mixed: true });
  },
  async pdf(b) {
    const h = findH(b.dataset.id); if (!h) return;
    const st = document.getElementById('pdf-status'), say = t => { if (st) st.textContent = t; };
    if (!pdfReady()) { say('The PDF generator could not be loaded in this browser.'); return; }
    b.disabled = true; say('Preparing your PDF…');
    await sleep(30);
    try {
      const out = getPdf(h), name = pdfName(h), pages = `${out.pages} page${out.pages > 1 ? 's' : ''}`;
      const c = window.claude;
      if (c && typeof c.use === 'function') {
        const dl = await c.use('downloads');
        if (!dl) { say('Saving files is not available in this view. Open the simulator on claude.ai, or use the offline copy (04_PMP_Exam_Simulator.html), to download the PDF.'); return; }
        await dl.save({ filename: name, data: out.blob });
        say(`Saved ${name} (${pages}).`);
      } else {
        const url = URL.createObjectURL(out.blob), a = document.createElement('a');
        a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        say(`Downloaded ${name} (${pages}).`);
      }
    } catch (e) {
      const code = e && e.code;
      say(code === 'declined' ? 'Download cancelled.' : code === 'rate_limited' ? 'A save prompt is already open. Try again in a moment.'
        : code === 'too_large' ? 'The PDF is too large to save here.' : code ? 'Saving files is not available in this view.'
        : 'Sorry, the PDF could not be created (' + ((e && e.message) || e) + ').');
    } finally { b.disabled = false; }
  },
  'toggle-history'() { ui.allHistory = !ui.allHistory; rerender(); },
  async 'clear-history'() {
    const ok = await ask({ title: 'Clear all results?', body: `This deletes every finished attempt ${cloud ? 'from this browser and from your Claude account' : 'saved in this browser'}. It cannot be undone.`, ok: 'Clear results', danger: true });
    if (!ok) return;
    const old = S.history; S.history = []; saveNow(); rerender(); cloudDelete(old);
  }
};

/* ---------- input handlers ---------- */
function onOpt(t) {
  const a = S.current; if (!a) return;
  const i = a.pos, Q = getQ(refsOf(a)[i]);
  if (a.checked[i]) return;
  const k = +t.value;
  if (Q.type === 'single') a.answers[i] = [k];
  else {
    let sel = Array.isArray(a.answers[i]) ? a.answers[i].slice() : [];
    if (t.checked) {
      if (sel.length >= Q.answer.length) { t.checked = false; toast(`Choose ${numWord(Q.answer.length)} options. Clear one before choosing another.`); return; }
      sel.push(k);
    } else sel = sel.filter(x => x !== k);
    sel.sort((x, y) => x - y);
    a.answers[i] = sel.length ? sel : null;
  }
  if (t.checked && a.strikes[i]) a.strikes[i] &= ~(1 << k);
  saveSoon(); rerender();
}
function onMatch(t) {
  const a = S.current; if (!a) return;
  const i = a.pos, Q = getQ(refsOf(a)[i]);
  if (a.checked[i]) return;
  const r = +t.name.slice(2), sel = Array.isArray(a.answers[i]) ? a.answers[i].slice() : Q.items.map(() => -1);
  sel[r] = +t.value; a.answers[i] = sel;
  saveSoon(); rerender();
}
function onFill(t) {
  const a = S.current; if (!a) return;
  const i = a.pos, Q = getQ(refsOf(a)[i]);
  if (a.checked[i]) return;
  a.answers[i] = t.value.trim() ? t.value : null;
  saveSoon();
  const n = refsOf(a).length, done = countAnswered(a), bar = document.querySelector('.pbar span');
  if (bar) bar.style.width = (100 * done / n).toFixed(2) + '%';
  const chk = document.getElementById('btn-check');
  if (chk) chk.disabled = !isAnswered(Q, a.answers[i]);
}
function primary() {
  const a = S.current; if (!a || a.phase !== 'question') return;
  if (a.kind !== 'exam') {
    const i = a.pos, Q = getQ(refsOf(a)[i]);
    if (!a.checked[i] && isAnswered(Q, a.answers[i])) { ACT.check(); return; }
    if (!a.checked[i]) return;
  }
  ACT.next();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act];
  if (fn) fn(b, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'opt') onOpt(t);
  else if (/^m-\d+$/.test(t.name || '')) onMatch(t);
  else if (t.dataset && t.dataset.qz) { prefs.quiz = readQuiz(); savePrefs(); updatePool(); }
  else if (t.id === 'rv-domain') { view.domain = t.value; rerender(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'fill-in') onFill(e.target);
  else if (e.target.id === 'calc-in') calcUpdate();
});
sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
  if (dlg.open || sheet.open) return;
  const t = e.target, tag = t && t.tagName;
  if (t && calcEl.contains(t)) {
    if (e.key === 'Escape') { e.preventDefault(); toggleCalc(false); return; }
    if (t === calcIn) { if (e.key === 'Enter') { e.preventDefault(); calcEquals(); } return; }
    if (e.key === 'Enter' || e.key === ' ') return;
    if (e.key === 'Backspace') { e.preventDefault(); calcIn.value = calcIn.value.slice(0, -1); calcUpdate(); }
    else if (/^[0-9.+\-*/()%^]$/.test(e.key)) { e.preventDefault(); calcIn.value += e.key; calcUpdate(); }
    return;
  }
  if (e.key === 'Escape' && !calcEl.hidden) { toggleCalc(false); return; }
  const a = S.current;
  if (view.screen !== 'exam' || !a || a.phase !== 'question') return;
  if (t && t.id === 'fill-in') { if (e.key === 'Enter') { e.preventDefault(); primary(); } return; }
  if (tag === 'SELECT' || tag === 'TEXTAREA' || (tag === 'INPUT' && t.type === 'text')) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === 'ArrowLeft') { if (tag === 'INPUT') return; e.preventDefault(); ACT[k === 'ArrowRight' ? 'next' : 'prev'](); return; }
  if (k === 'Enter') { if (tag === 'BUTTON' || tag === 'A' || tag === 'SUMMARY') return; e.preventDefault(); primary(); return; }
  if (k === 'f' || k === 'F') { e.preventDefault(); ACT.flag(); return; }
  if (k.length !== 1) return;
  let idx = '12345'.indexOf(k);
  if (idx < 0) idx = 'abcde'.indexOf(k.toLowerCase());
  if (idx < 0) return;
  const inp = document.getElementById('opt-' + idx);
  if (inp && !inp.disabled) { e.preventDefault(); inp.click(); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { if (clock) account(); saveNow(); } });
window.addEventListener('pagehide', () => { if (clock) account(); saveNow(); });

applyTheme();
render();
initCloud();
})();
</script>
